name: Badges

on:
  schedule:
    - cron: "17 */3 * * *"
  release:
    types: [published]
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the download and star badges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          downloads=$(gh api "repos/$REPO/releases" --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')
          stars=$(gh api "repos/$REPO" --jq .stargazers_count)
          mkdir out
          curl -fsS --retry 5 --retry-all-errors -o out/downloads.svg "https://img.shields.io/badge/downloads-${downloads}-2ea44f?style=for-the-badge"
          curl -fsS --retry 5 --retry-all-errors -o out/stars.svg "https://img.shields.io/badge/stars-${stars}-e3b341?style=for-the-badge&logo=github"
          cd out
          git init -q -b badges
          git config user.name "Rhyvo"
          git config user.email "208987291+rhyvo@users.noreply.github.com"
          git add .
          git commit -qm "Badges: ${downloads} downloads, ${stars} stars"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
